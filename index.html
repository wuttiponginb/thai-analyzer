function tImg(c,rev){
  const u=tImgUrl(c);

}

function tStory(c){
  const p=c.t==='major'?[T_STORY[c.no]]:[T_RS[c.no-1],T_SS[c.t]];

function tCard(c){
  const r=(l,x)=>x?`<div class="sm" style="margin-top:4px"><b>${l}</b> ${esc(x)}</div>`:'';

function tList(){
  const q=T.q.trim().toLowerCase();
  const l=TAROT.filter(c=>(T.f==='all'||c.t===T.f)&&(!q||(c.th+c.en+c.up+c.rev).toLowerCase().includes(q)));

      'ความหวัง แสงสว่างหลังพายุ ความตระหนักรู้ ความสงบทางใจ และแรงบันดาลใจอันสดใส',
      'ความไม่แน่นอน ภาพลวงตา สัญชาตญาณในความมืด ความกังวลที่คิดไปเอง และสิ่งที่ยังซ่อนอยู่',
      'ความสุข ความสำเร็จ ชัดเจน แจ่มแจ้ง พลังชีวิตที่เต็มเปี่ยม และความมั่นใจอันเปี่ยมล้น',
      'การตื่นรู้ครั้งใหญ่ การเรียกขานของชะตาชีวิต การปลดล็อกอดีต และการตัดสินใจเลือกเส้นทางใหม่',
      'ความสำเร็จสมบูรณ์ การจบภารกิจอย่างงดงาม ความลงตัว และการก้าวสู่มิติใหม่ของชีวิต'
    ];
    coreMsg = majMsgs[c.no] || c.up;
  } else {
    coreMsg = (rev ? c.rev : c.up) + (c.suit ? ' (' + c.suit + ')' : '');
  }

  if(rev){
    return `ไพ่ <b>${esc(name)}</b> ในสภาวะ<b>ไพ่คว่ำ</b> บ่งบอกถึงพลังงานของไพ่ที่ถูกกดทับ ชะลอตัว หรือแสดงผลในมุมกลับ (${esc(coreMsg)}) ในเวลานี้คุณอาจรู้สึกว่ามีสิ่งอั้นอยู่ภายใน หรือกำลังเจอแรงต้านจากภายนอก เป็นสัญญาณเตือนให้หยุดทบทวน ชะลอความใจร้อน และแก้ไขปัญหารากฐานก่อนจะเดินหน้าต่อ`;
  } else {
    return `ไพ่ <b>${esc(name)}</b> ในสภาวะ<b>ไพ่หงาย</b> ส่งพลังงานบริสุทธิ์และชัดเจน (${esc(coreMsg)}) สถานการณ์ตรงหน้าเปิดกว้าง มีแนวโน้มที่พลังงานจะไหลลื่นตามธรรมชาติ เหมาะแก่การลงมือทำด้วยความเชื่อมั่นและการตั้งใจจริง`;
  }
}

function getTopicDetail(c, rev, topicIdx){
  const kw = rev ? c.rev : c.up;
  const isMaj = c.t === 'major';
  
  if(topicIdx === 0){ // ความรัก
    if(isMaj && c.love) return c.love + (rev ? ' (แต่ในสภาวะคว่ำ ควรระวังอารมณ์ชั่ววูบ การยึดติด หรือความไม่เข้าใจกัน)' : ' (พลังงานเปิดกว้าง เหมาะแก่การกระชับความสัมพันธ์)');
    if(c.t === 'cups') return (rev ? 'ความรู้สึกอัดอั้น มีข้อขัดแย้งทางอารมณ์ หรือความคาดหวังที่ยังไม่ตรงกัน ควรเปิดใจคุยกันอย่างใจเย็น' : 'บรรยากาศอบอุ่น มีความเข้าใจ ไหลลื่นทางอารมณ์ และมีโอกาสกระชับความสัมพันธ์ให้ลึกซึ้งยิ่งขึ้น');
    if(c.t === 'wands') return (rev ? 'ต่างฝ่ายต่างมีภารกิจวุ่นวาย จนอาจละเลยความรู้สึกของกันและกัน' : 'ความสัมพันธ์เต็มไปด้วยพลังงาน ความตื่นเต้น และการทำกิจกรรมร่วมกัน');
    if(c.t === 'swords') return (rev ? 'ความระแวง คิดมาก หรือคำพูดที่ทิ่มแทงกัน ควรลดการเอาชนะด้วยเหตุผล' : 'เน้นการใช้สติและเหตุผลในการพูดคุย ละเว้นการใช้อารมณ์เข้าหากัน');
    if(c.t === 'pentacles') return (rev ? 'กังวลเรื่องการสร้างอนาคต หรือปัจจัยด้านการเงินส่งผลต่อความสัมพันธ์' : 'ความสัมพันธ์มั่นคง เป็นเกื้อหนุนกันในชีวิตประจำวันและการสร้างฐานะ');
    return rev ? 'ความสัมพันธ์ชะลอตัว ควรให้สเปซและทบทวนความรู้สึกตนเอง' : 'ความสัมพันธ์เดินหน้าไปในทิศทางที่ดี มีความสอดคล้องกัน';
  }

  if(topicIdx === 1){ // การงาน
    if(isMaj && c.work) return c.work + (rev ? ' (ระวังความผิดพลาดจากความประมาท หรือระบบที่ไม่เป็นใจ)' : ' (จังหวะการงานโดดเด่น มีโอกาสก้าวหน้า)');
    if(c.t === 'wands') return (rev ? 'เหน็ดเหนื่อยกับการแบกภาระ หรือโครงการล่าช้า ขาดแรงจูงใจในการทำงาน' : 'งานมีความก้าวหน้า มีไฟในการทำงาน โครงการใหม่ได้รับการตอบรับดี');
    if(c.t === 'cups') return (rev ? 'บรรยากาศในที่ทำงานไม่อบอุ่นเท่าที่ควร หรือใช้อารมณ์ตัดสินงาน' : 'ทำงานด้วยความสุข มีความสัมพันธ์ที่ดีกับเพื่อนร่วมงานและลูกค้า');
    if(c.t === 'swords') return (rev ? 'สับสนในเป้าหมาย เอกสารสัญญาติดขัด หรือมีความขัดแย้งในทีม' : 'ใช้วิเคราะห์และตัดสินใจได้อย่างเด็ดขาด แก้ปัญหาเฉพาะหน้าได้ดี');
    if(c.t === 'pentacles') return (rev ? 'ผลงานยังไม่เห็นผลชัดเจน ต้องใช้ความอดทนรอนานกว่าที่คิด' : 'งานสร้างผลตอบแทนเป็นรูปธรรม ได้รับผลตอบแทนสมน้ำสมเนื้อ ความมั่นคงสูง');
    return rev ? 'งานติดขัดชั่วคราว ควรตรวจสอบความถูกต้องอย่างรอบคอบ' : 'การงานมีแนวโน้มราบรื่น เดินหน้าตามแผนงานที่วางไว้';
  }

  if(topicIdx === 2){ // การเงิน
    if(c.t === 'pentacles') return (rev ? 'ระวังหมุนเงินไม่ทัน มีรายจ่ายกะทันหัน หรือการลงทุนผิดจังหวะ' : 'สภาพคล่องการเงินดี มีรายรับเข้ามาตามเป้า การลงทุนเริ่มได้ผลตอบแทน');
    if(c.t === 'swords') return (rev ? 'กังวลเรื่องหนี้สิน หรือมีค่าใช้จ่ายเกี่ยวกับเอกสาร คดีความ/ค่าปรับ' : 'ต้องวางแผนงบประมาณอย่างรัดกุม ตัดรายจ่ายที่ไม่จำเป็นออกไป');
    if(c.t === 'cups') return (rev ? 'ใช้จ่ายตามอารมณ์ ซื้อความสุขจนเงินรั่วไหล' : 'การเงินคล่องตัว ได้รับการช่วยเหลือสนับสนุนจากคนใกล้ชิด');
    if(c.t === 'wands') return (rev ? 'ลงทุนไปแล้วยังไม่ได้เงินคืนทันที ต้องออกแรงเพิ่มขึ้น' : 'มีโอกาสสร้างรายได้จากงานใหม่ๆ หรือธุรกิจขยายตัว');
    return rev ? 'การเงินต้องระมัดระวังเป็นพิเศษ งดเว้นการเสี่ยงโชคเกินตัว' : 'สถานะการเงินมั่นคง บริหารจัดการได้ดี';
  }

  if(topicIdx === 3){ // ภาพรวมชีวิต
    return rev ? 'ชีวิตอยู่ในช่วงปรับฐาน อาจมีเรื่องให้ต้องแก้ไขและเรียนรู้ เพื่อเตรียมพร้อมสำหรับการเติบโตระรอบใหม่' : 'ชีวิตอยู่ในจังหวะขาขึ้น พลังงานส่งเสริมให้กล้าคิดกล้าทำและเปิดรับโอกาสใหม่ๆ';
  }

  if(topicIdx === 4){ // การตัดสินใจ
    return rev ? 'อย่าพึ่งรีบร้อนตัดสินใจในขณะที่ข้อมูลยังไม่ครบ หรืออารมณ์ยังไม่นิ่ง ควรชะลอเพื่อดูสถานการณ์ก่อน' : 'สถานการณ์เอื้ออำนวยให้ตัดสินใจได้ทันที ใช้เหตุผลและสัญชาตญาณควบคู่กันจะนำไปสู่ผลลัพธ์ที่ดี';
  }

  if(topicIdx === 5){ // การพัฒนาตัวเอง
    return rev ? 'ยอมรับจุดอ่อนของตนเอง เรียนรู้จากข้อผิดพลาดในอดีต และปลดล็อกความกลัวที่ซ่อนอยู่ในใจ' : 'มุ่งมั่นพัฒนาทักษะใหม่ๆ ดึงศักยภาพภายในออกมาใช้อย่างเต็มที่ เพิ่มความเชื่อมั่นในตนเอง';
  }

  if(topicIdx === 6){ // สุขภาพ ครอบครัว การเรียน
    return rev ? 'ระวังสุขภาพผันผวนจากความเครียดหรือพักผ่อนไม่เพียงพอ ในครอบครัวควรเว้นวรรคเพื่อฟังกันมากขึ้น' : 'สุขภาพกายและใจสมบูรณ์ บรรยากาศในครอบครัวและการเรียนเป็นไปอย่างราบรื่นมีความสุข';
  }

  return kw;
}

        'สื่อสารและสร้างความสัมพันธ์กับผู้คนด้วยความจริงใจและสุจริต'

function buildFreeSummary(cs, P, T, z, bc, n){
  const maj = cs.filter(x=>x.c.t==='major').length;
  const rv = cs.filter(x=>x.rev).length;
  const mi = cs.filter(x=>x.c.t!=='major');
  
  let structHtml = `<b>1.1 สัดส่วนอิทธิพลของชะตาชีวิต (Major Arcana):</b><br>`;
  if(maj / n >= 0.4){
    structHtml += `มีไพ่ชุดใหญ่ปรากฏถึง <b>${maj} จาก ${n} ใบ (${Math.round(maj/n*100)}%)</b> ซึ่งถือว่าเป็นสัดส่วนที่สูงมาก! บ่งบอกว่าสถานการณ์ที่คุณกำลังถามถึงนี้เป็น<b>จุดเปลี่ยนสำคัญของชีวิต (Life Milestone)</b> หรือเป็นเรื่องราวที่มีปัจจัยเรื่องชะตาลิขิตเข้ามาเกี่ยวข้อง ไม่ใช่เรื่องเล็กน้อยประจำวัน คุณต้องใช้สติ สัจจะ และปัญญาในการก้าวผ่าน`;
  } else if(maj === 0){
    structHtml += `ในสำรับนี้<b>ไม่มีไพ่ชุดใหญ่ปรากฏเลย (0%)</b> สื่อว่าเรื่องราวทั้งหมดอยู่ใน<b>ขอบเขตการควบคุมและการตัดสินใจของคุณ 100%</b> เป็นเรื่องทางกายภาพและการบริหารจัดการประจำวัน คุณมีอิสระเต็มที่ในการกำหนดทิศทางด้วยตนเอง`;
  } else {
    structHtml += `มีไพ่ชุดใหญ่ปรากฏ <b>${maj} จาก ${n} ใบ</b> สื่อถึงความผสมผสานระหว่างปัจจัยภายนอกที่คุณต้องปรับตัวเข้าหา กับทางเลือกส่วนตัวที่คุณสามารถควบคุมได้อย่างสมดุล`;
  }

  structHtml += `<br><br><b>1.2 สภาวะการไหลของพลังงาน (Upright vs Reversed):</b><br>`;
  if(rv / n >= 0.6){
    structHtml += `พบไพ่คว่ำถึง <b>${rv} จาก ${n} ใบ (${Math.round(rv/n*100)}%)</b> สื่อว่าสภาวะจิตใจหรือสถานการณ์ในขณะนี้มี<b>ความติดขัด ชะลอตัว หรือเป็นการเปลี่ยนแปลงที่เน้นการทำงานภายในจิตใจ (Internal Work)</b> สิ่งที่คุณคาดหวังภายนอกอาจล่าช้ากว่ากำหนด แนะนำให้ชะลอความใจร้อนและกลับมาแก้ไขปัญหารากฐานก่อน`;
  } else if(rv === 0){
    structHtml += `ไพ่ทั้งหมดอยู่ในสภาวะ<b>หงาย 100%</b> สื่อว่าพลังงานกำลัง<b>ไหลไปข้างหน้าอย่างเปิดเผย เคลื่อนไหว และชัดเจน</b> สิ่งที่คุณคิดและลงมือทำจะได้รับการตอบรับที่ตรงไปตรงมา ไม่มีอุปสรรคซ่อนเร้น`;
  } else {
    structHtml += `มีทั้งไพ่หงาย (${n-rv} ใบ) และไพ่คว่ำ (${rv} ใบ) ผสมผสานกัน สื่อถึงจังหวะชีวิตที่มีทั้งส่วนที่เดินหน้าได้อย่างราบรื่น และส่วนที่ยังต้องปรับจูนแก้ไขควบคู่กันไป`;
  }

  const sc = {};
  mi.forEach(x => sc[x.c.t] = (sc[x.c.t] || 0) + 1);
  const topSuit = Object.keys(sc).sort((a,b)=>sc[b]-sc[a])[0];
  
  structHtml += `<br><br><b>1.3 สมดุลธาตุประจำสำรับ (Elemental Balance):</b><br>`;
  if(topSuit && sc[topSuit] >= 2){
    const suitObj = T_SUITS.find(s=>s.k===topSuit);
    structHtml += `ธาตุที่โดดเด่นที่สุดในไพ่ชุดนี้คือ <b>ชุด${R_SU[topSuit]} (ธาตุ${R_EL[topSuit]})</b> จำนวน ${sc[topSuit]} ใบ — เน้นหนักในเรื่อง<b>${suitObj?suitObj.d:''}</b>`;
    if(R_EL[topSuit] === z.el){
      structHtml += `<br>✨ <i>ข้อสังเกตพิเศษ:</i> ธาตุหลักของไพ่ตรงกับธาตุประจำราศีเกิดของคุณ (ราศี${z.name} - ธาตุ${z.el}) ทำให้คุณมีความคุ้นเคยและรับมือกับสภาวะนี้ได้อย่างเป็นธรรมชาติ`;
    }
  } else {
    structHtml += `พลังงานธาตุทั้งสี่ (ไฟ, น้ำ, ลม, ดิน) กระจายตัวอย่างสมดุล สื่อถึงสถานการณ์ที่มีหลายมิติประกอบกัน ทั้งการลงมือทำ อารมณ์ ความคิด และเรื่องการเงิน`;
  }

  const topicHtml = T.map(t => {
    const rl = cs.map((x,i)=>({x,i})).filter(o => o.x.c.t === 'major' || rMatch(o.x.c, t));
    const up = rl.filter(o => !o.x.rev).length;
    const dn = rl.length - up;
    
    let analysisText = '';
    if(!rl.length){
      analysisText = 'ไม่มีไพ่ที่ตรงกับหมวดนี้โดยตรง ให้พิจารณาจากภาพรวมของสำรับและไพ่ที่ให้คำแนะนำในตำแหน่งสุดท้าย';
    } else if(up > dn){
      analysisText = `ไพ่ที่เกี่ยวข้องส่วนใหญ่เป็น<b>ไพ่หงาย (${up}/${rl.length} ใบ)</b> แนวโน้มในเรื่องนี้เปิดกว้าง มีโอกาสสำเร็จและเติบโตสูง ให้ลุยทำตามแผนด้วยความมั่นใจ`;
    } else if(dn > up){
      analysisText = `ไพ่ที่เกี่ยวข้องส่วนใหญ่เป็น<b>ไพ่คว่ำ (${dn}/${rl.length} ใบ)</b> มีสัญญาณเตือนถึงความติดขัดหรือชะลอตัว ควรตรวจสอบรายละเอียด ระวังความประมาท และหลีกเลี่ยงการตัดสินใจด้วยอารมณ์`;
    } else {
      analysisText = `พลังงานไพ่หงายและคว่ำมีสัดส่วนเท่ากัน มีทั้งโอกาสและข้อควรระวังขนานคู่กันไป ต้องใช้ความรอบคอบและความอดทนสูง`;
    }

    const cardNames = rl.map(o => `<b>${esc(o.x.c.en)}</b> (${o.x.rev?'คว่ำ':'หงาย'})`).join(', ');

    return `<div class="rp" style="margin-top:10px;padding:8px;background:rgba(255,255,255,0.03);border-radius:8px">
      <b>🧭 ด้าน${esc(R_TOP[t])}:</b><br>
      <span class="sm">ไพ่ที่ส่งผลโดยตรง: ${cardNames || '—'}</span><br>
      ${analysisText}<br>
      <div style="margin-top:4px;font-size:13px;color:var(--t)">💡 <b>แนวทางรับมือ:</b> ${getTopicDetail(rl[0]?rl[0].x.c:cs[0].c, rl[0]?rl[0].x.rev:cs[0].rev, t)}</div>
    </div>`;
  }).join('');

  const finalOutcomeCard = cs[n-1];
  const outcomeText = finalOutcomeCard ? `ไพ่ตำแหน่งปลายทางคือ <b>${esc(finalOutcomeCard.c.en)}</b> (${finalOutcomeCard.rev?'คว่ำ':'หงาย'}) — ${rText(finalOutcomeCard.c, finalOutcomeCard.rev, T[0])}` : '';

  return { structHtml, topicHtml, outcomeText };
}

function tarotView(){
  return `<div class="tabs">${[['read','🔮 ทำนายดวง'],['lib','📖 คลังไพ่ 78 ใบ']].map(t=>`<div class="tab ${R.sub==t[0]?'on':''}" onclick="R.sub='${t[0]}';render()">${t[1]}</div>`).join('')}</div>`+(R.sub==='lib'?tarotLib():rView());
}
function rTog(i){const k=R.topics.indexOf(i);if(k>=0){if(R.topics.length>1)R.topics.splice(k,1);}else R.topics.push(i);R.topics.sort((a,b)=>a-b);render();}
function rView(){
  if(R.step==='pick')return rPickView();
  if(R.step==='result')return rResult();
  const yr=[];for(let y=2569;y>=2440;y--)yr.push([y,y]);
  const op=(a,s)=>a.map(x=>`<option value="${x[0]}" ${s==x[0]?'selected':''}>${x[1]}</option>`).join('');
  const SP=[[1,'1 ใบ — คำถามสั้น ๆ / พลังงานประจำวัน'],[3,'3 ใบ — อดีต-ปัจจุบัน-อนาคต / สถานการณ์-อุปสรรค-คำแนะนำ'],[5,'5 ใบ — ภาพรวมแบบละเอียดขึ้น'],[7,'7 ใบ — ความรัก/ความสัมพันธ์ (หรือ Horseshoe)'],[10,'10 ใบ — Celtic Cross เชิงลึก'],[12,'12 ใบ — รายเดือนตลอดปี']];
  const canAI=!!(S.pw||(S.acct&&S.acct.role==='user'));
  return `<div class="card"><b>🔮 ทำนายดวงด้วยไพ่ยิปซี</b>
  <div class="sm" style="margin:.5rem 0 .3rem">1) วัน เดือน ปีเกิด (พ.ศ.)</div>
  <div class="row"><select class="sel" onchange="R.d=+this.value">${op(Array.from({length:31},(_,i)=>[i+1,i+1]),R.d)}</select><select class="sel" onchange="R.m=+this.value">${op(MONTHS.map((m,i)=>[i,m]),R.m)}</select><select class="sel" onchange="R.y=+this.value">${op(yr,R.y)}</select></div>
  <div class="sm" style="margin:.2rem 0 .3rem">2) จำนวนไพ่ที่จะอ่าน</div>
  <select class="sel" onchange="R.n=+this.value;render()">${op(SP,R.n)}</select>
  ${R.n===3?`<select class="sel" onchange="R.vr=+this.value"><option value="0" ${R.vr?'':'selected'}>อดีต - ปัจจุบัน - อนาคต</option><option value="1" ${R.vr?'selected':''}>สถานการณ์ - อุปสรรค - คำแนะนำ</option></select>`:''}
  <div class="sm" style="margin:.2rem 0 .3rem">3) เรื่องที่อยากรู้ (เลือกได้หลายเรื่อง)</div>
  <div class="tabs">${R_TOP.map((t,i)=>`<div class="tab ${R.topics.includes(i)?'on':''}" onclick="rTog(${i})">${R.topics.includes(i)?'✓ ':''}${esc(t)}</div>`).join('')}</div>
    <div class="sm" style="margin:.2rem 0 .3rem">4) รูปแบบคำทำนาย</div>
  <div class="tabs">
    <div class="tab ${R.mode!=='ai'?'on':''}" onclick="R.mode='free';render()">🌐 ดูฟรี (คำอ่านแบบขยายความ)</div>
    <div class="tab ${R.mode==='ai'?'on':''}" onclick="R.mode='ai';render()">${canAI?'🤖':'🔒'} AI ละเอียด (ใช้ 1 Token)</div>
  </div>
  ${R.mode==='ai'?(canAI
    ?`<div class="sm">${S.pw?'✅ Admin ใช้ได้ฟรี':'🪙 Token คงเหลือ '+S.acct.tokens+' · จะหัก 1 Token ตอนเปิดไพ่ (คืนให้ถ้า AI ทำนายไม่สำเร็จ)'}</div>`
    :`<div class="sm">🔒 ต้องเข้าสู่ระบบด้วยบัญชี User ที่แท็บ Thai Lottery Analyzer ก่อน และมี Token อย่างน้อย 1 · หรือเลือก "ดูฟรี"</div>`):''}
  <div class="err" id="rmsg"></div>
  <button class="btn g" onclick="rStart()">${R.mode==='ai'?'🤖 ทำนายด้วย AI (ใช้ 1 Token)':'🔮 ทำนายดวง (ฟรี)'}</button>
  <button class="btn" onclick="R.mode='ai';rStart(true)">🔮🧠 ดูไพ่ + MBTI (ใช้ 1 Token)</button>
  <button class="btn" onclick="R.mode='ai';rStart(true,true)">🔮🧠🌌 ไพ่ + MBTI + Birth Chart (ใช้ 1 Token)</button>
  <button class="btn" onclick="R.mode='ai';rStart(false,true)">🔮🌌 ไพ่ + Birth Chart (ใช้ 1 Token)</button></div>`;
}
function rStart(withMbti,withChart){
  R.mbtiOn=!!withMbti;R.chartOn=!!withChart;
  const dt=new Date(R.y-543,R.m,R.d);
  if(dt.getDate()!==R.d||dt.getMonth()!==R.m){$('rmsg').textContent='วันเกิดไม่ถูกต้อง (เช่น 31 กุมภาพันธ์)';return;}
  if(withChart&&!B.res){$('rmsg').textContent='🌌 โปรดสร้างดวงกำเนิดที่แท็บ Birth Chart ก่อน · ยังไม่ได้หัก Token';return;}
  if(R.mode==='ai'){
    if(!(S.pw||(S.acct&&S.acct.role==='user'))){$('rmsg').textContent='🔒 ต้องเข้าสู่ระบบด้วยบัญชี User ก่อน หรือเลือกโหมดดูฟรี';return;}
    if(!S.pw&&S.acct.tokens<1){$('rmsg').textContent='🪙 Token ไม่พอ ซื้อ Token ได้ที่แท็บ 💳 ซื้อ/ต่ออายุ หรือเลือกโหมดดูฟรี';return;}
  }
  const a=[...Array(78).keys()],r=new Uint32Array(78);crypto.getRandomValues(r);
  for(let i=77;i>0;i--){const j=r[i]%(i+1);[a[i],a[j]]=[a[j],a[i]];}
  R.deck=a;R.pick=[];R.step='pick';render();
}
function rGrid(){return R.deck.map((c,i)=>{const k=R.pick.indexOf(i);return `<button class="tb ${k>=0?'on':''}" onclick="rPick(${i})">${k>=0?k+1:'✦'}</button>`;}).join('');}
function rPickView(){
  return `<div class="card"><b>🃏 ตั้งจิตนึกถึงเรื่อง ${R.topics.map(t=>'"'+esc(R_TOP[t])+'"').join(' และ ')} แล้วเลือกไพ่ ${R.n} ใบ</b>
  <div class="sm">เลขบนไพ่คือลำดับที่เลือก (ตำแหน่งที่ 1 → ${R.n}) กดซ้ำเพื่อยกเลิก</div>
  <div class="tgrid" id="tgrid">${rGrid()}</div>
  <div class="row" style="align-items:center"><span id="tcnt">เลือกแล้ว ${R.pick.length}/${R.n}</span>
  <button class="btn g" id="rgo" onclick="rReveal()" ${R.pick.length===R.n?'':'disabled'}>✨ เปิดไพ่และอ่าน</button>
  <button class="btn o" onclick="R.step='form';render()">← กลับ</button></div></div>`;
}
function rPick(i){
  const k=R.pick.indexOf(i);
  if(k>=0)R.pick.splice(k,1);else if(R.pick.length<R.n)R.pick.push(i);
  $('tgrid').innerHTML=rGrid();$('tcnt').textContent='เลือกแล้ว '+R.pick.length+'/'+R.n;$('rgo').disabled=R.pick.length!==R.n;
}
function rReveal(){
  if(R.mode==='ai'){
    const msg=S.pw?'ยืนยันให้ AI ทำนายแบบละเอียดใช่ไหม?\n(Admin ไม่ถูกหัก Token)'
      :'ยืนยันให้ AI ทำนายแบบละเอียดใช่ไหม?\n\nจะหัก 1 Token ทันที (คืนให้ถ้า AI ทำนายไม่สำเร็จ)';
    if(!confirm(msg))return;
  }
  const r=new Uint8Array(R.n);crypto.getRandomValues(r);
  R.out=R.pick.map((p,i)=>({c:TAROT[R.deck[p]],rev:(r[i]&1)===1}));
  R.ai=null;R.step='result';render();if(R.mode==='ai')rAI();
}
async function rAI(){
  const my=R.out;
  if(!S.token&&!S.pw){R.ai={err:'login'};render();return;}
  if(S.acct&&S.acct.role!=='user'){R.ai={err:'viewer'};render();return;}
  R.ai={loading:true};render();
  const P=rPos(),z=rZodiac(R.d,R.m),bc=rBirthCards();
  const payload={
    topics:R.topics.map(t=>R_TW[t]),
    useMbti:!!R.mbtiOn, mbti:(S.mbti||{}).type||'',
    useChart:!!R.chartOn, chart:R.chartOn?bcSummary():'',
    born:R.d+' '+MONTHS[R.m]+' '+R.y,
    zodiac:z.name+' ธาตุ'+z.el,
    birthCard:bc.birth.en, yearCard:bc.year.en,
    cards:R.out.map((x,i)=>({
      name:x.c.en+(x.c.t==='major'?' ('+x.c.th+')':''), rev:x.rev,
      pos:(P[i]||[''])[0], posDesc:(P[i]||['',''])[1], keywords:x.rev?x.c.rev:x.c.up}))
  };
  try{
    const d=await api('apiTarotReading',cred(),payload);
    if(R.out!==my)return;
    R.ai={data:d};
    if(d.tokens!=null&&S.acct)S.acct.tokens=d.tokens;
  }catch(e){if(R.out!==my)return;R.ai={err:e.message};}
  if(R.step==='result')render();
}

function rAskAI(){
  if(!(S.pw||(S.acct&&S.acct.role==='user'))){R.ai={err:'login'};render();return;}
  if(!S.pw&&S.acct.tokens<1){R.ai={err:'Token ไม่พอ ซื้อ Token ได้ที่แท็บ Thai Lottery Analyzer > ซื้อ/ต่ออายุ'};render();return;}
  const msg=S.pw?'ยืนยันให้ AI ทำนายไพ่ชุดนี้แบบละเอียดใช่ไหม?'
    :'ยืนยันให้ AI ทำนายไพ่ชุดนี้แบบละเอียดใช่ไหม?\n\nจะหัก 1 Token ทันที';
  if(!confirm(msg))return;
  rAI();
}
function rResult(){
  const cs=R.out,P=rPos(),n=cs.length,T=R.topics;const A=R.ai&&R.ai.data;
const pre='style="white-space:pre-line"';
  const z=rZodiac(R.d,R.m),bc=rBirthCards();
  
  const cards=cs.map((x,i)=>{
    const c=x.c,pt=P[i]||['',''],role=rRole(pt[0],n),base=rText(c,x.rev,T[0]);
    const kw=c[x.rev?'rev':'up'].split(' ').filter(Boolean).map(k=>`<span class="kw">${esc(k)}</span>`).join('');
    const frame=R_FR[role][x.rev?1:0].replace('{t}',base);
    
    let feat=c.t==='major'?`⭐ ไพ่ใบใหญ่ (เลข ${c.no}) น้ำหนักสูง สื่อถึงบทเรียนหรือจุดเปลี่ยนสำคัญของชีวิต ไม่ใช่เรื่องผิวเผิน`
      :`ชุด${R_SU[c.t]} ธาตุ${R_EL[c.t]} (เรื่อง${c.suit}) · ${c.no<=10?'เลข '+c.no+' หมายถึง'+R_NUM[c.no]:'ไพ่ราชสำนัก แทนบุคคลหรือบทบาท/ท่าทีที่เกี่ยวข้อง'}`;

    const ac=A&&A.cards&&A.cards[i];

    let body = '';
    if(ac){
      body = `<div class="rp"><b>✨ ${esc(ac.headline)}</b></div><div class="rp" ${pre}>${esc(ac.reading)}</div>${ac.advice?`<div class="rp" ${pre}><b>💡 คำแนะนำ:</b> ${esc(ac.advice)}</div>`:''}`;
    } else {
      // FREE MODE - อ่านทำนายละเอียดขยายความเต็มรูปแบบ
      const deepSymbol = getCardDeepMeaning(c, x.rev);
      const dosDonts = getCardDosAndDonts(c, x.rev);
      const topicLines = T.map(t=>{
        const w=c.t==='major'?'น้ำหนักสูง':rMatch(c,t)?(R_REL[t].length?'ตรงชุดหลัก น้ำหนักสูง':'อ่านได้ทุกชุด'):'เป็นปัจจัยแวดล้อม น้ำหนักรอง';
        return `<div class="rp" style="margin-top:4px">• <b>ด้าน${esc(R_TW[t])}:</b> ${esc(getTopicDetail(c,x.rev,t))} <span class="sm">(${w})</span></div>`;
      }).join('');

      body = `
        <div class="rp" style="margin-top:6px"><b>📖 การอ่านไพ่ในตำแหน่ง "${esc(pt[0])}":</b><br>${esc(frame)}</div>
        <div class="rp" style="margin-top:8px"><b>🔮 ความหมายไพ่เชิงลึกและสัญลักษณ์:</b><br>${deepSymbol}</div>
        <div class="rp" style="margin-top:8px"><b>🎯 การวิเคราะห์เจาะลึกตามเรื่องที่ถาม:</b></div>
        ${topicLines}
        <div class="rp" style="margin-top:10px;padding:8px;background:rgba(0,229,160,0.05);border-left:3px solid var(--a);border-radius:6px">
          <b>📌 สิ่งที่ควรทำ (Dos):</b>
          <ul style="margin-left:18px;margin-top:4px">
            ${dosDonts.dos.map(d=>`<li>${esc(d)}</li>`).join('')}
          </ul>
          <b style="margin-top:6px;display:block">⚠️ สิ่งที่ควรระวัง (Don'ts):</b>
          <ul style="margin-left:18px;margin-top:4px">
            ${dosDonts.donts.map(d=>`<li>${esc(d)}</li>`).join('')}
          </ul>
        </div>
        <details style="margin-top:8px;cursor:pointer"><summary class="sm"><b>📜 ดูประวัติ เรื่องราวภาพในไพ่ และที่มาเพิ่มเติม</b></summary>
          <div style="font-size:12px;line-height:1.6;margin-top:6px">${tStory(c)}</div>
        </details>
      `;
    }

    return `<div class="h rcard ${x.rev?'rev':''}"><div class="sm">ตำแหน่ง ${i+1} · <b>${esc(pt[0])}</b> — ${esc(pt[1])}</div>
    <div style="margin:2px 0"><b>${esc(c.en)}</b> ${c.t==='major'?`<span class="sm">${esc(c.th)}</span>`:''} · ${x.rev?'<b style="color:var(--w)">↓ ไพ่คว่ำ</b>':'<b style="color:var(--a)">↑ ไพ่หงาย</b>'}</div>
    ${tImg(c,x.rev)}
    <div>${kw}</div>

    <div class="sm rp" style="margin-top:8px">${x.rev?'ไพ่คว่ำ = พลังงานของไพ่อ่อนลง ถูกกดไว้ ใช้เกินพอดี หรือกำลังเปลี่ยนแปลง · ':'ไพ่หงาย = พลังงานทำงานตามธรรมชาติของไพ่ ชัดเจนและเปิดเผย · '}${feat}</div></div>`;

    :ai.loading?box('⏳ กำลังประมวลผล...')
    :ai.err==='login'?box('🔒 ต้องเข้าสู่ระบบด้วยบัญชี User (ที่แท็บ Thai Lottery Analyzer) จึงจะใช้ AI ทำนายได้ ตอนนี้แสดงคำอ่านฉบับเต็มฟรี')
    :ai.err==='viewer'?box('👀 บัญชี Viewer เป็นโหมดตัวอย่าง (แสดงคำอ่านฉบับเต็มฟรี)')
    :box('⚠ สร้างคำทำนายจาก AI ไม่สำเร็จ: '+esc(ai.err)+' (แสดงคำอ่านฉบับเต็มฟรีแทน) '+btn);

  const introHtml=A&&A.intro?`<div class="sumbox" ${pre}>${esc(A.intro)}</div>`:'';

/* ---------- Admin: จัดการ User ---------- */
const DAYMS=864e5;
const ST_TH={approved:'อนุมัติแล้ว',pending:'รออนุมัติ',rejected:'ไม่อนุมัติ'};
const daysLeft=u=>u.expiredAt?Math.ceil((u.expiredAt-Date.now())/DAYMS):null;
const fdate=t=>t?new Date(t).toLocaleDateString('th-TH'):'—';
function uMatch(u){
  const q=(S.uq||'').trim().toLowerCase(), d=daysLeft(u), f=S.uf, s=u.stats||{};
  if(q&&!([u.username,u.name,u.contact].some(x=>String(x||'').toLowerCase().includes(q))))return false;
  if(f==='pending')return u.status==='pending';
  if(f==='near')return u.status==='approved'&&d!==null&&d>=0&&d<=7;
  if(f==='expired')return d!==null&&d<0;
  if(f==='req')return s.renewPending>0||s.buyPending>0;
  return true;
}
function uSort(a,b){
  const k=u=>u.status==='pending'?-1e9:(daysLeft(u)===null?1e9:daysLeft(u));
  return k(a)-k(b);
}
function userCard(u){
  const d=daysLeft(u), s=u.stats||{};
  let ex='ยังไม่มีวันหมดอายุ', c='';
  if(d!==null){
    ex=(d<0?'หมดอายุแล้ว '+(-d)+' วัน':d===0?'หมดอายุวันนี้':'เหลือ '+d+' วัน')+' ('+fdate(u.expiredAt)+')';
    c=d<0?'bad':d<=7?'warn':'good';
  }
  const flags=[];
  if(s.renewPending)flags.push(`<span class="pill warn">🔄 ขอต่ออายุ ${s.renewPending} รายการ รอตรวจ</span>`);
  if(s.buyPending)flags.push(`<span class="pill warn">🪙 ขอซื้อ Token ${s.buyPending} รายการ รอตรวจ</span>`);
  return `<div class="card ucard" data-u="${esc(u.username)}">
    <div class="top" style="margin-bottom:.3rem"><b>${esc(u.name||'—')} <span class="sm">@${esc(u.username)} · ${esc(u.role)}</span></b>
      <span class="pill ${u.status==='approved'?'good':u.status==='pending'?'warn':'bad'}">${esc(ST_TH[u.status]||u.status)}</span></div>
    <div class="sm">📞 ${esc(u.contact||'—')} · สมัคร ${fdate(u.createdAt)} · เข้าล่าสุด ${fdate(u.lastLogin)}</div>
    <div class="grid2">
      <div><span class="sm">อายุบัญชี</span><b class="${c}">${esc(ex)}</b></div>
      <div><span class="sm">Token คงเหลือ</span><b>🪙 ${u.tokens}</b></div>
    </div>
    ${flags.length?`<div class="flags">${flags.join('')}</div>`:''}
    <div class="st">
      🪙 ซื้อ Token แล้ว ${s.buyCount||0} ครั้ง${s.buyCount?` · รวม ${s.buyTokens} Token · ฿${s.buyBaht}${s.lastBuy?' · ล่าสุด '+fdate(s.lastBuy):''}`:''}<br>
      🔄 ต่ออายุแล้ว ${s.renewCount||0} ครั้ง${s.lastRenew?' · ล่าสุด '+fdate(s.lastRenew):''}<br>
      ❤️ Donate ${s.donateCount||0} ครั้ง${s.lastDonate?' · ล่าสุด '+fdate(s.lastDonate):''}<br>
      🎯 สุ่มเอง ${s.spins||0} ครั้ง
    </div>
    ${u.role==='user'?`<div class="act">
      <input class="inp tk" type="number" step="1" placeholder="Token (ใส่ - เพื่อหัก)">
      <input class="inp tn" placeholder="หมายเหตุ (ไม่บังคับ)">
      <button class="btn g" onclick="addTk(this)">＋ ปรับ Token</button>
    </div>
    <div class="act">
      <input class="inp pw" autocomplete="off" placeholder="Password ใหม่ (อย่างน้อย 4 ตัว)">
      <button class="btn" onclick="setPw(this)">🔑 เปลี่ยนรหัส</button>
    </div>`:''}
  </div>`;
}
function usersList(){
  const l=(S.users||[]).filter(uMatch).sort(uSort);
  return l.length?l.map(userCard).join(''):'<div class="sm">ไม่พบบัญชีที่ตรงเงื่อนไข</div>';

function drawUsers(){const e=$('ulist');if(e)e.innerHTML=usersList();}
function usersView(){
  const L=S.users;
  if(!L)return '<div class="err" id="msg"></div><div class="sm">กำลังโหลด…</div>';
  const dl=u=>daysLeft(u);
  const pend=L.filter(u=>u.status==='pending').length;
  const near=L.filter(u=>u.status==='approved'&&dl(u)!==null&&dl(u)>=0&&dl(u)<=7).length;
  const exp=L.filter(u=>dl(u)!==null&&dl(u)<0).length;
  const req=L.filter(u=>(u.stats.renewPending||0)+(u.stats.buyPending||0)>0).length;
  const tk=L.reduce((a,u)=>a+u.tokens,0);
  const F=[['all','ทั้งหมด'],['pending','รออนุมัติ'],['near','ใกล้หมดอายุ (≤7 วัน)'],['expired','หมดอายุแล้ว'],['req','มีคำขอรอตรวจ']];
  return `<div class="err" id="msg" style="position:sticky;top:0;background:var(--bg);z-index:5"></div>
    <div class="sumbox" style="margin-top:0">👥 ทั้งหมด ${L.length} · รออนุมัติ ${pend} · ใกล้หมดอายุ ${near} · หมดอายุแล้ว ${exp} · มีคำขอรอตรวจ ${req} · 🪙 รวมทุกบัญชี ${tk}</div>

    </div>
    <div id="ulist">${usersList()}</div>`;
}

ESFJ:'ใส่ใจความต้องการของผู้คนและสร้างความกลมเกลียวในกลุ่ม ชอบบทบาทที่ได้ดูแลและจัดการ มีความรับผิดชอบสูง|ให้ความอบอุ่นและเอาใจใส่ ต้องการความรู้สึกว่าถูกชื่นชม ควรฝึกรับคำวิจารณ์โดยไม่รู้สึกเป็นการปฏิเสธ|เมื่อเครียดอาจจับผิดตัวเองหรือคนอื่นด้วยตรรกะแข็งๆ ควรกำหนดขอบเขต พักผ่อน และแยกคุณค่าตัวเองออกจากการยอมรับของผู้อื่น',
ISTP:'สังเกตอย่างเงียบๆ แล้วลงมือแก้ปัญหาด้วยเครื่องมือและเหตุผลเชิงปฏิบัติ ชอบอิสระและงานที่เห็นผลจริง|ไม่ชอบถูกควบคุม แสดงความใส่ใจด้วยการช่วยลงมือ มักพูดความรู้สึกน้อย ควรบอกให้อีกฝ่ายรู้ว่าอยู่ตรงนั้นเพื่อเขา|เมื่อเครียดอาจอ่อนไหวและรู้สึกไม่ถูกยอมรับ ควรสื่อสารอารมณ์ให้เร็วขึ้นและวางแผนล่วงหน้าบ้าง',
ISFP:'ใช้ชีวิตตามค่านิยมและประสาทสัมผัส รักความงามและอิสระ แสดงตัวตนผ่านการลงมือและงานสร้างสรรค์มากกว่าคำพูด|อ่อนโยน ยืดหยุ่น ไม่ชอบความขัดแย้ง ควรบอกความต้องการจริงของตนแทนการเก็บไว้|เมื่อเครียดอาจเข้มงวดและวิจารณ์เกินปกติ ควรตั้งเป้าหมายระยะกลางง่ายๆ และขอคำแนะนำจากคนที่ไว้ใจ',
ESTP:'อยู่กับปัจจุบันและตอบสนองสถานการณ์ได้ไวมาก ชอบลงมือ ทดลอง และเรียนรู้จากของจริง รับมือวิกฤตได้ดี|ตรงไปตรงมา สนุก ชอบกิจกรรมร่วมกัน ควรฝึกคิดถึงผลระยะยาวและความรู้สึกคู่|เมื่อเครียดอาจกังวลหรือเห็นภาพอนาคตแง่ร้ายเกินจริง ควรหยุดคิดถึงผลระยะยาวก่อนลงมือและเว้นเวลาพัก',
ESFP:'อยู่กับปัจจุบันและเรียนรู้จากประสบการณ์ตรง เข้ากับคนง่าย สร้างบรรยากาศสนุกและอบอุ่น ใส่ใจความรู้สึกคนรอบตัว|ให้ความอบอุ่นและเสียงหัวเราะ ต้องการคนที่ยอมรับตัวตนจริง ควรฝึกวางแผนเรื่องเงินและระยะยาว|เมื่อเครียดอาจกลัวอนาคตหรือหมกมุ่นกับสิ่งที่อาจผิดพลาด ควรเริ่มวางแผนเล็กๆ และขอความเห็นจากคนที่เชื่อใจ'};
const M_STK={INTJ:'Ni-Te-Fi-Se',INTP:'Ti-Ne-Si-Fe',ENTJ:'Te-Ni-Se-Fi',ENTP:'Ne-Ti-Fe-Si',INFJ:'Ni-Fe-Ti-Se',INFP:'Fi-Ne-Si-Te',ENFJ:'Fe-Ni-Se-Ti',ENFP:'Ne-Fi-Te-Si',ISTJ:'Si-Te-Fi-Ne',ISFJ:'Si-Fe-Ti-Ne',ESTJ:'Te-Si-Ne-Fi',ESFJ:'Fe-Si-Ne-Ti',ISTP:'Ti-Se-Ni-Fe',ISFP:'Fi-Se-Ni-Te',ESTP:'Se-Ti-Fe-Ni',ESFP:'Se-Fi-Te-Ni'};
const M_FD={Ne:'จินตนาการและเชื่อมโยงไอเดียกับความเป็นไปได้ภายนอก',Ni:'หยั่งรู้ภาพอนาคตและรูปแบบเบื้องหลังจากภายใน',Se:'ตื่นตัวกับปัจจุบัน ประสาทสัมผัส และการลงมือทันที',Si:'จดจำประสบการณ์ รายละเอียด และสิ่งที่เคยได้ผล',Te:'จัดระบบ วัดผล และตัดสินใจด้วยตรรกะภายนอก',Ti:'วิเคราะห์หลักการและความสอดคล้องเชิงเหตุผลในใจ',Fe:'อ่านอารมณ์ผู้อื่นและรักษาความกลมเกลียวของกลุ่ม',Fi:'ยึดค่านิยมและความรู้สึกที่แท้จริงของตัวเอง'};
const M_FR=['ตัวนำ — ใช้คล่องและเป็นธรรมชาติที่สุด','ตัวสนับสนุน — ช่วยถ่วงดุลตัวนำ','ตัวรอง — พัฒนาช้า ใช้ผ่อนคลาย','จุดอ่อน — ใช้ยากสุด แต่เป็นพื้นที่เติบโต'];
const M_LD={E:'ได้พลังจากการพบปะและกิจกรรมภายนอก คิดผ่านการพูดคุย ชอบมีส่วนร่วม มักเป็นฝ่ายเริ่มต้น',I:'ได้พลังจากเวลาส่วนตัวและโลกความคิดภายใน คิดก่อนพูด ชอบความลึกมากกว่าความกว้างในความสัมพันธ์',S:'เชื่อข้อมูลที่จับต้องได้ ชอบขั้นตอนชัดเจน ใส่ใจรายละเอียด เรียนรู้จากประสบการณ์จริง',N:'มองหารูปแบบ ความหมาย และความเป็นไปได้ ชอบแนวคิดและอนาคต เบื่อกิจวัตรซ้ำๆ',T:'ตัดสินจากตรรกะ ความเป็นธรรม และความถูกต้อง สื่อสารตรงไปตรงมา',F:'ตัดสินจากคุณค่า ความรู้สึก และผลต่อผู้คน ใส่ใจความกลมเกลียวและน้ำใจ',J:'ชอบวางแผน ตัดสินใจแล้วปิดงาน ชอบความแน่นอนและตารางที่ชัดเจน',P:'ชอบเปิดตัวเลือก ปรับตามสถานการณ์ เก็บข้อมูลไปเรื่อยๆ ทำงานได้ดีเมื่อใกล้เดดไลน์'};
const M_DIFF=['ลองดูว่าหลังวันที่เจอคนมากๆ คุณ "เติมพลัง" หรือ "หมดพลัง" — ใช้ดูแทนการดูว่าพูดเก่งหรือไม่','ถามตัวเองว่าเวลาเรียนเรื่องใหม่ คุณเริ่มจากตัวอย่างและขั้นตอนจริง (S) หรือจากภาพรวมและแนวคิด (N)','ดูว่าตอนตัดสินใจยากๆ คุณเอา "ความถูกต้องเป็นธรรม" (T) หรือ "ผลกระทบต่อคนที่เกี่ยวข้อง" (F) ขึ้นมาก่อน — ไม่ใช่ดูว่าคุณมีหัวใจหรือไม่','ดูว่าคุณสบายใจเมื่อ "ตัดสินใจแล้วจบ" (J) หรือเมื่อ "ยังเปิดตัวเลือกอยู่" (P) — ไม่ใช่ดูว่าห้องรกหรือไม่'];
const mLvl=p=>p<55?['กึ่งกลางมาก','#ff9f43']:p<65?['โน้มเอียงเล็กน้อย','#ffcb6b']:p<80?['ชัดเจน','#7c6aff']:['เด่นมาก','#00e5a0'];
const mFx=p=>p<55?'คุณใช้ทั้งสองขั้วได้ใกล้เคียงกัน ผลด้านนี้ไม่แน่นอน ควรอ่านไทป์ใกล้เคียงด้านล่างประกอบ':p<65?'คุณโน้มไปทางนี้แต่ไม่แรง หลายสถานการณ์อาจใช้อีกขั้วได้เหมือนกัน':p<80?'แนวโน้มชัดเจน มักแสดงออกในชีวิตประจำวัน':'แนวโน้มแรงมาก แทบเป็นธรรมชาติของคุณในด้านนี้';
const mGrp=c=>c[1]==='N'?(c[2]==='T'?'นักวิเคราะห์':'นักการทูต'):(c[3]==='J'?'ผู้เฝ้ายาม':'นักสำรวจ');
const mParse=t=>String(t||'').split(',').filter(Boolean).map(s=>({l:s[0],p:+s.slice(1)||50}));
function mScore(){
  const s=[0,0,0,0];
  M_Q.forEach((q,i)=>{const v=(M.a[i]||3)-3,d=M_PAIR.findIndex(p=>p.includes(q.l));s[d]+=q.l===M_PAIR[d][0]?v:-v;});
  const sc=s.map((x,d)=>({l:x>0?M_PAIR[d][0]:M_PAIR[d][1],p:Math.round(50+Math.abs(x)/M_MAX*50),tie:x===0}));
  return{type:sc.map(x=>x.l).join(''),sc:sc};
}
function mStackHtml(c){
  const f=(M_STK[c]||'').split('-');if(f.length<4)return'';
  return `<div class="sec-title">🧬 ลำดับฟังก์ชันความคิด (Cognitive Functions) · ${esc(M_STK[c])}</div>`+f.map((x,i)=>`<div class="rp"><b>${i+1}. ${x}</b> — ${esc(M_FD[x]||'')}<br><span class="sm">${M_FR[i]}</span></div>`).join('');
}
function mTypeHtml(t){
  const e=(M_EXT[t.c]||'').split('|');
  return `<div class="rp">${esc(t.s)}</div>${e[0]?`<div class="rp"><b>🧠 วิธีคิดเชิงลึก:</b> ${esc(e[0])}</div>`:''}<div class="rp"><b>💪 จุดแข็ง:</b> ${esc(t.g)}</div><div class="rp"><b>⚠️ จุดควรระวัง:</b> ${esc(t.w)}</div>${e[1]?`<div class="rp"><b>❤️ ความสัมพันธ์:</b> ${esc(e[1])}</div>`:''}${e[2]?`<div class="rp"><b>🌱 ตอนเครียด/แนวทางพัฒนา:</b> ${esc(e[2])}</div>`:''}<div class="rp"><b>💼 อาชีพที่มักเหมาะ:</b> ${esc(t.j)}</div>${mStackHtml(t.c)}`;
}
function mNear(r){
  const idx=r.sc.map((x,d)=>d).filter(d=>r.sc[d].p<65).sort((a,b)=>r.sc[a].p-r.sc[b].p).slice(0,3);
  if(!idx.length)return`<div class="sumbox">✅ ทั้ง 4 ด้านคะแนนค่อนข้างชัด (65% ขึ้นไป) ผลนี้จึงค่อนข้างน่าเชื่อถือสำหรับแบบทดสอบนี้</div>`;
  const out=idx.map(d=>{const c=r.type.split('');c[d]=c[d]===M_PAIR[d][0]?M_PAIR[d][1]:M_PAIR[d][0];const k=c.join('');return{d,k};});
  return`<div class="sec-title">🔍 ไทป์ใกล้เคียงที่เป็นไปได้</div><div class="sumbox">ด้านที่คะแนนไม่ขาด อาจทำให้ไทป์จริงเป็นแบบอื่นได้:${out.map(o=>{const t=M_T[o.k]||{n:''};return`<div style="margin-top:8px"><b style="color:var(--a)">${o.k}</b> ${esc(t.n)} <span class="sm">(ต่างที่ ${M_DIM[o.d]} · คุณได้ ${r.sc[o.d].l} ${r.sc[o.d].p}%)</span><div class="sm">💡 ${esc(M_DIFF[o.d])}</div></div>`;}).join('')}</div>`;
}
function mAns(i,n){M.a[i]=n;const r=$('mq'+i);if(r)r.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('on',k+1===n));}
function mNav(d){
  const st=M.pg*M_PG;
  if(d>0){for(let i=st;i<st+M_PG;i++)if(!M.a[i])return say('กรุณาตอบให้ครบทุกข้อในหน้านี้');}
  if(d>0&&M.pg===M_NP-1){M.res=mScore();S.mbti=M.res;M.retake=0;render();mSave();return;}
  M.pg=Math.max(0,M.pg+d);render();scrollTo(0,0);
}
async function mSave(){
  if(S.acct&&S.acct.role==='user'){
    try{await api('apiMbtiSave',S.token,S.mbti.type,S.mbti.sc.map(x=>x.l+x.p).join(','));say('✅ บันทึกผล MBTI ของคุณแล้ว',1);}
    catch(e){say('บันทึกผลไม่สำเร็จ: '+e.message);}
  }else say('โหมด Admin/Viewer: ผลอยู่เฉพาะรอบนี้ ไม่ได้บันทึกถาวร');
}
async function loadMbti(){
  try{const r=await api('apiMbtiGet',S.token);if(r)S.mbti={type:r.type,sc:mParse(r.scores)};}catch(e){}
  render();
}
function mTest(){
  if(!M.retake&&(M.res||S.mbti))return mResult();
  const st=M.pg*M_PG,qs=M_Q.slice(st,st+M_PG),done=Object.keys(M.a).length;
  return `<div class="card"><b>🧠 แบบทดสอบ MBTI (ฟรี) · หน้า ${M.pg+1}/${M_NP}</b>
  <div class="sm">ตอบตามที่เป็นจริงในชีวิตประจำวัน ไม่ใช่ตามที่อยากเป็น · 1 = ไม่ตรงเลย · 3 = กลางๆ · 5 = ตรงมาก · ตอบแล้ว ${done}/${M_N}</div></div>
  ${qs.map((q,j)=>{const i=st+j;return `<div class="h"><div>${i+1}. ${esc(q.t)}</div><div class="row" id="mq${i}" style="margin-top:6px">${[1,2,3,4,5].map(n=>`<div class="tab ${M.a[i]===n?'on':''}" onclick="mAns(${i},${n})">${n}</div>`).join('')}</div></div>`;}).join('')}
  <div class="row">${M.pg>0?'<button class="btn o" onclick="mNav(-1)">← ก่อนหน้า</button>':''}<button class="btn g" onclick="mNav(1)">${M.pg===M_NP-1?'✨ ดูผล':'ถัดไป →'}</button></div><div class="err" id="msg"></div>`;
}
function mResult(){
  const r=M.res||S.mbti,t=M_T[r.type]||{c:r.type,n:'',s:'',g:'',w:'',j:''};
  const bar=(x,d)=>{const lv=mLvl(x.p),o=M_PAIR[d].replace(x.l,'');return`<div style="margin:10px 0"><div class="sm">${M_DIM[d]} → <b style="color:var(--a)">${esc(x.l)}</b> ${x.p}% · <b style="color:${lv[1]}">${lv[0]}</b>${x.tie?' (กึ่งกลางพอดี)':''}</div><div style="position:relative;height:8px;background:var(--s2);border-radius:99px"><div style="width:${x.p}%;height:8px;background:var(--a2);border-radius:99px"></div></div><div class="sm" style="margin-top:3px"><b>${x.l}</b>: ${esc(M_LD[x.l])}</div><div class="sm">↳ ${esc(mFx(x.p))}${x.p<65?` (อีกขั้วคือ ${o})`:''}</div></div>`;};
  return`<div class="card"><div class="sm">ผล MBTI ของคุณ · กลุ่ม${mGrp(r.type)}</div><div class="n3" style="font-size:34px">${esc(r.type)}</div><b>${esc(t.n)}</b>
  <div class="sumbox">${r.sc.map(bar).join('')}</div>${mNear(r)}<div class="sec-title">📋 รายละเอียดไทป์ ${esc(r.type)}</div>${mTypeHtml(t)}
  <div class="sm" style="margin-top:8px">เปอร์เซ็นต์ใกล้ 50% แปลว่าคุณอยู่กึ่งกลางของด้านนั้น ผลอาจต่างได้เมื่อทำใหม่ในช่วงชีวิตอื่น แบบทดสอบนี้ไม่ใช่ MBTI® ฉบับทางการ</div>
  <div class="row" style="margin-top:.6rem"><button class="btn g" onclick="S.app='tarot';R.sub='read';R.step='form';render()">🔮 ดูไพ่ยิปซี + MBTI</button><button class="btn o" onclick="M.res=null;M.a={};M.pg=0;M.retake=1;render()">🔄 ทำแบบทดสอบใหม่</button></div><div class="err" id="msg"></div></div>`;

    if(!cusps){cusps=bcHouses('E',asc,mc,th,eps,B.lat);note='ละติจูดสูงเกิน 66° ระบบ Placidus คำนวณไม่ได้ จึงใช้ Equal House แทน';}
  }
  const pl=BC_PL.map(p=>{const l=p1[p[0]],dl=nm(p2[p[0]]-l+180)-180;
    return{k:p[0],g:p[1],n:p[2],l:l,r:p[0]!=='sun'&&p[0]!=='moon'&&p[0]!=='node'&&dl<0,h:cusps?bcHouseOf(l,cusps):0};});
  const asp=[],bd=pl.filter(x=>x.k!=='node');
  for(let i=0;i<bd.length;i++)for(let j=i+1;j<bd.length;j++){
    let df=Math.abs(bd[i].l-bd[j].l);if(df>180)df=360-df;
    for(const a of BC_ASP){const o=Math.abs(df-a[1]);if(o<=a[2]){asp.push({a:bd[i],b:bd[j],t:a,o:o});break;}}
  }
  return{pl:pl,asc:asc,mc:mc,cusps:cusps,asp:asp,off:off,tzTxt:tzTxt,utc:new Date(ms),note:note,unk:B.unk};
}

/* ---------- วาดวงดวง (SVG) ---------- */
function bcSvg(c){
  const W=560,cx=280,cy=280,R1=250,R2=212,R3=146,R4=116,base=c.asc==null?0:c.asc;
  const ang=l=>(180+(l-base))*D2R,P=(l,r)=>[cx+r*Math.cos(ang(l)),cy-r*Math.sin(ang(l))],f=n=>n.toFixed(1);
  const fill=['#ff5f6d26','#00e5a026','#ffcb6b26','#7c6aff26'],col=['#ff5f6d','#00e5a0','#ffcb6b','#9b8cff'];
  let s=`<svg id="bsvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${W}" style="width:100%;max-width:560px;display:block;margin:auto" font-family="sans-serif"><rect width="${W}" height="${W}" rx="14" fill="#0d0f12"/>`;
  for(let i=0;i<12;i++){
    const pts=[];for(let k=0;k<=6;k++)pts.push(P(i*30+k*5,R1));for(let k=6;k>=0;k--)pts.push(P(i*30+k*5,R2));
    s+=`<polygon points="${pts.map(p=>f(p[0])+','+f(p[1])).join(' ')}" fill="${fill[i%4]}" stroke="#252a38"/>`;
    const g=P(i*30+15,(R1+R2)/2);s+=`<text x="${f(g[0])}" y="${f(g[1])}" fill="${col[i%4]}" font-size="22" text-anchor="middle" dominant-baseline="central">${BC_SG[i]}</text>`;
  }
  for(let l=0;l<360;l+=5){const a=P(l,R2),b=P(l,R2-(l%10?4:7));s+=`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="#3a3f5a"/>`;}
  [R2,R3,R4].forEach(r=>s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#252a38"/>`);
  if(c.cusps){
    c.cusps.forEach((l,i)=>{const a=P(l,R3),b=P(l,R2),ax=i%3===0;s+=`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${ax?'#8a90a8':'#3a3f5a'}" stroke-width="${ax?1.8:1}"/>`;
      const n=c.cusps[(i+1)%12],m=P(l+nm(n-l)/2,R3-12);s+=`<text x="${f(m[0])}" y="${f(m[1])}" fill="#8a90a8" font-size="11" text-anchor="middle" dominant-baseline="central">${i+1}</text>`;});
    [['AC',c.asc],['IC',nm(c.mc+180)],['DC',nm(c.asc+180)],['MC',c.mc]].forEach(a=>{const p=P(a[1],R1+13);s+=`<text x="${f(p[0])}" y="${f(p[1])}" fill="#e8eaf0" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">${a[0]}</text>`;});
  }
  c.asp.forEach(a=>{const p=P(a.a.l,R4),q=P(a.b.l,R4);s+=`<line x1="${f(p[0])}" y1="${f(p[1])}" x2="${f(q[0])}" y2="${f(q[1])}" stroke="${a.t[3]}" stroke-width="1" opacity="${a.o<2?.95:.55}"/>`;});
  const L=c.pl.slice().sort((a,b)=>a.l-b.l),n=L.length;L.forEach(p=>p.da=p.l);
  for(let it=0;it<80;it++)for(let i=0;i<n;i++){const j=(i+1)%n,gap=nm(L[j].da-L[i].da);if(gap<8){const m=(8-gap)/2;L[i].da-=m;L[j].da+=m;}}
  L.forEach(p=>{
    const a=P(p.l,R2),b=P(p.l,R2-9),g=P(p.da,190),t=P(p.da,166),q=P(p.l,R4);
    s+=`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="#e8eaf0"/><circle cx="${f(q[0])}" cy="${f(q[1])}" r="2" fill="#e8eaf0"/>`;
    s+=`<text x="${f(g[0])}" y="${f(g[1])}" fill="#e8eaf0" font-size="20" text-anchor="middle" dominant-baseline="central">${p.g}</text>`;
    s+=`<text x="${f(t[0])}" y="${f(t[1])}" fill="${p.r?'#ff9f43':'#8a90a8'}" font-size="10" text-anchor="middle" dominant-baseline="central">${Math.floor(nm(p.l)%30)}°${p.r?'℞':''}</text>`;
  });
  return s+'</svg>';
}

/* ---------- แสดงผล ---------- */
const bcDM=x=>{const t=Math.floor(nm(x)%30*60);return Math.floor(t/60)+'°'+String(t%60).padStart(2,'0')+'′';};
const bcSign=l=>Math.floor(nm(l)/30);
function bcResult(c){
  const ce=B.y-543,pad=n=>String(n).padStart(2,'0'),u=c.utc;
  const rows=c.pl.map(p=>`<tr><td>${p.g} ${esc(p.n)}</td><td>${BC_SG[bcSign(p.l)]} ${BC_SN[bcSign(p.l)]}</td><td>${bcDM(p.l)}${p.r?' <b style="color:var(--w)">℞</b>':''}</td><td>${p.h||'—'}</td></tr>`).join('');
  const ang=c.asc==null?'':`<tr><td><b>ASC</b> ลัคนา</td><td>${BC_SG[bcSign(c.asc)]} ${BC_SN[bcSign(c.asc)]}</td><td>${bcDM(c.asc)}</td><td>1</td></tr><tr><td><b>MC</b> กลางหาว</td><td>${BC_SG[bcSign(c.mc)]} ${BC_SN[bcSign(c.mc)]}</td><td>${bcDM(c.mc)}</td><td>10</td></tr>`;
  const el=[0,0,0,0];c.pl.slice(0,10).forEach(p=>el[bcSign(p.l)%4]++);
  const asp=c.asp.sort((a,b)=>a.o-b.o).map(a=>`<div class="sm">${a.a.g} ${esc(a.a.n)} ${a.t[0]} ${a.b.g} ${esc(a.b.n)} <span style="color:${a.t[3]}">${a.t[4]}</span> · ออร์บ ${a.o.toFixed(1)}°</div>`).join('')||'<div class="sm">ไม่พบมุมสัมพันธ์หลัก</div>';
  return `<div class="sec-title">ดวงกำเนิด</div>${bcSvg(c)}
  <div class="row" style="margin:.6rem 0"><button class="btn g" onclick="bcPng()">⬇ ดาวน์โหลดรูป PNG</button></div>
  <div class="sumbox">📅 ${B.d} ${MONTHS[B.m]} พ.ศ. ${B.y} (ค.ศ. ${ce}) · ${c.unk?'ไม่ทราบเวลา (ใช้ 12:00 น. ไม่แสดงลัคนา/เรือนชะตา)':pad(B.h)+':'+pad(B.mi)+' น.'}<br>
  🌍 ${esc(B.city||'-')} · ${B.lat.toFixed(4)}°, ${B.lon.toFixed(4)}° · UTC${c.off>=0?'+':''}${(c.off/60).toFixed(2).replace(/\.?0+$/,'')} (${esc(c.tzTxt)})<br>
  🕒 UT: ${u.getUTCFullYear()}-${pad(u.getUTCMonth()+1)}-${pad(u.getUTCDate())} ${pad(u.getUTCHours())}:${pad(u.getUTCMinutes())}${c.note?'<br>⚠ '+esc(c.note):''}</div>
  <div class="sec-title">ตำแหน่งดาว (Tropical)</div>
  <table class="bct"><tr><th>ดาว</th><th>ราศี</th><th>องศา</th><th>เรือน</th></tr>${ang}${rows}</table>
  <div class="sec-title">ธาตุ (ดาว 10 ดวง)</div><div class="sm">🔥 ไฟ ${el[0]} · 🌍 ดิน ${el[1]} · 💨 ลม ${el[2]} · 💧 น้ำ ${el[3]}</div>
  <div class="sec-title">มุมสัมพันธ์ (Aspects)</div>${asp}
  <div class="sm" style="margin-top:8px">คำนวณจากสูตรวงโคจรในหน้าเว็บ ไม่ใช้ AI · ความละเอียดราว 1–2 ลิปดาสำหรับดาวส่วนใหญ่ ดวงจันทร์คลาดได้ราว 0.1–0.3° · ใช้ราศีจักรแบบ Tropical (ตะวันตก) ไม่ใช่ไทย/นิรายนะ · ช่วงปีที่แม่นยำที่สุด ค.ศ. 1800–2100</div>`;
}
function bcPng(){
  const el=$('bsvg');if(!el)return;
  const cl=el.cloneNode(true);cl.setAttribute('width',1120);cl.setAttribute('height',1120);cl.style.maxWidth='none';
  const img=new Image();
  img.onload=()=>{const cv=document.createElement('canvas');cv.width=cv.height=1120;cv.getContext('2d').drawImage(img,0,0,1120,1120);
    const a=document.createElement('a');a.download='birth-chart.png';a.href=cv.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove();};
  img.onerror=()=>say('สร้างไฟล์รูปไม่สำเร็จ ลองแคปหน้าจอแทน');
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(cl));
}
function bcCityPick(val){
  const c=BC_CITY.filter(x=>x.n.toLowerCase()===String(val).trim().toLowerCase())[0];
  if(!c)return;B.tz=c.tz;$('blat').value=c.lat;$('blon').value=c.lon;$('btz').value='auto';
}
window.BC_SR=[];
async function bcSearch(){
  const q=v('bcity').trim(),o=$('bsr');if(!q)return;o.innerHTML='<div class="sm">กำลังค้นหา…</div>';
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=th&q='+encodeURIComponent(q));
    BC_SR=await r.json();
    o.innerHTML=BC_SR.length?BC_SR.map((x,i)=>`<div class="tab" style="display:block;margin:3px 0" onclick="bcPickSr(${i})">📍 ${esc(x.display_name)}</div>`).join(''):'<div class="sm">ไม่พบเมืองนี้ กรอกละติจูด/ลองจิจูดเอง</div>';
  }catch(e){o.innerHTML='<div class="err">ค้นหาออนไลน์ไม่ได้ ให้เลือกเมืองจากรายการหรือกรอกพิกัดเอง</div>';}
}
function bcPickSr(i){
  const x=BC_SR[i],la=+x.lat,lo=+x.lon;
  $('blat').value=la.toFixed(4);$('blon').value=lo.toFixed(4);
  B.tz=(la>5.5&&la<20.6&&lo>97.3&&lo<105.7)?'Asia/Bangkok':'';
  $('btz').value=B.tz?'auto':String(Math.round(lo/15));
  $('bsr').innerHTML='<div class="sm ok">เลือกแล้ว'+(B.tz?'':' · โปรดตรวจสอบ Timezone/DST ให้ตรงกับสถานที่เกิด')+'</div>';
}
function bcCalc(){
  const g=id=>$(id).value;
  B.d=+g('bd');B.m=+g('bm');B.y=+g('by');B.unk=$('bu').checked;B.h=+g('bh');B.mi=+g('bn');
  B.lat=parseFloat(g('blat'));B.lon=parseFloat(g('blon'));B.tzSel=g('btz');B.dst=g('bdst');B.hs=g('bhs');B.city=g('bcity');
  const m=$('bmsg'),dt=new Date(B.y-543,B.m,B.d);
  if(dt.getDate()!==B.d||dt.getMonth()!==B.m){m.textContent='วันเกิดไม่ถูกต้อง';return;}
  if(!(B.lat>=-90&&B.lat<=90&&B.lon>=-180&&B.lon<=180)){m.textContent='ละติจูด/ลองจิจูดไม่ถูกต้อง';return;}
  if(B.tzSel==='auto'&&!BC_CITY.some(x=>x.n.toLowerCase()===B.city.trim().toLowerCase()&&x.tz===B.tz)&&!B.tz){}
  m.textContent='';
  try{B.res=bcCompute();$('bres').innerHTML=bcResult(B.res);}catch(e){m.textContent='คำนวณไม่สำเร็จ: '+e.message;}
}
function chartView(){

  const rng=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push([i,String(i).padStart(2,'0')]);return r;};

  <label class="sm" style="flex:2;min-width:140px"><input type="checkbox" id="bu" ${B.unk?'checked':''}> ไม่ทราบเวลาเกิด</label></div>
  <div class="sm" style="margin:.2rem 0 .3rem">เมืองที่เกิด (พิมพ์เลือกจากรายการ หรือกดค้นหาออนไลน์)</div>
  <div class="row"><input class="inp" id="bcity" list="bcl" style="flex:2;min-width:150px" value="${esc(B.city)}" oninput="bcCityPick(this.value)" onchange="bcCityPick(this.value)"><datalist id="bcl">${BC_CITY.map(c=>`<option value="${esc(c.n)}">`).join('')}</datalist><button class="btn o" onclick="bcSearch()">🔍 ค้นหาออนไลน์</button></div>
  <div id="bsr"></div>
  <div class="row"><input class="inp" id="blat" type="number" step="0.0001" placeholder="ละติจูด" value="${B.lat}" style="flex:1"><input class="inp" id="blon" type="number" step="0.0001" placeholder="ลองจิจูด" value="${B.lon}" style="flex:1"></div>

  <div class="row"><select class="sel" id="btz">${o(tzs,B.tzSel)}</select><select class="sel" id="bdst"><option value="off" ${B.dst==='off'?'selected':''}>DST: ไม่ใช้ (Auto ใช้ฐานข้อมูลอยู่แล้ว)</option><option value="on" ${B.dst==='on'?'selected':''}>DST: +1 ชม. (เมื่อกำหนด UTC เอง)</option></select></div>
  <div class="sm" style="margin:.2rem 0 .3rem">ระบบเรือนชะตา</div>
  <select class="sel" id="bhs"><option value="P" ${B.hs==='P'?'selected':''}>Placidus</option><option value="W" ${B.hs==='W'?'selected':''}>Whole Sign</option><option value="E" ${B.hs==='E'?'selected':''}>Equal House</option></select>
  <div class="err" id="bmsg"></div><button class="btn g" onclick="bcCalc()">🌌 สร้างดวงกำเนิด</button></div>
  <div id="bres" class="card" style="${B.res?'':'display:none'}">${B.res?bcResult(B.res):''}</div>`;
}
/* ทำให้กล่องผลโชว์เมื่อคำนวณเสร็จ */

</script>
<script>
/* ===== Birth Chart + AI (วางต่อท้ายบล็อก Birth Chart เดิม ก่อน </body>) ===== */
function bcSummary(){

const _bcR=bcResult;bcResult=function(c){return _bcR(c)+bcAiBox();};
async function bcAI(){

<script>
/* ===== Patch: คำอธิบายระบบเรือน + ล็อกหน้าจอตอนใช้ AI + ยืนยันก่อนหัก Token ===== */

/* 2) คำอธิบายปุ่มในแท็บไพ่ยิปซี */
const _rv=rView;

/* 3) ล็อกหน้าจอตอนรอ AI + เตือนถ้าพยายามปิดหน้า */
function aiLock(on){
  let e=$('aiov');
  if(!on){if(e)e.remove();document.body.style.overflow='';window.onbeforeunload=null;return;}
  if(!e){e=document.createElement('div');e.id='aiov';e.className='ov';
    e.innerHTML='<div class="spin"></div><div class="t1">กำลังประมวลผลคำทำนายจาก AI</div><div class="t2">ใช้เวลาประมาณ 20-40 วินาที<br>กรุณาอย่าปิดหรือรีเฟรชหน้านี้</div>';
    document.body.appendChild(e);}
  document.body.style.overflow='hidden';
  window.onbeforeunload=ev=>{ev.preventDefault();ev.returnValue='';return '';};
}
/* หน้าไพ่มี overlay ของตัวเองอยู่แล้ว เพิ่มเฉพาะการเตือนตอนปิดหน้า */
const _rAI=rAI;
rAI=async function(){
  window.onbeforeunload=ev=>{ev.preventDefault();ev.returnValue='';return '';};
  try{await _rAI();}finally{window.onbeforeunload=null;}
};

/* 4) ข้อความยืนยันก่อนใช้ AI (บอกว่าทำอะไร / หัก Token / ใช้เวลา / ห้ามปิดหน้า) */
function aiCfm(what){
  return '🤖 ยืนยันใช้ AI '+what+' ใช่ไหม?\n\n'
   +(S.pw?'• Admin ไม่ถูกหัก Token':'• หัก 1 Token ทันที (คืนให้อัตโนมัติถ้า AI ทำนายไม่สำเร็จ)')
   +'\n• ใช้เวลาประมาณ 20-40 วินาที\n• ระหว่างรอ หน้าจอจะถูกล็อก กรุณาอย่าปิดหรือรีเฟรชหน้านี้\n\nกด OK เพื่อดำเนินการต่อ';
}
function rReveal(){
  if(R.mode==='ai'&&!confirm(aiCfm('ทำนายไพ่'+(R.mbtiOn?' + MBTI':'')+(R.chartOn?' + Birth Chart':''))))return;
  const r=new Uint8Array(R.n);crypto.getRandomValues(r);
  R.out=R.pick.map((p,i)=>({c:TAROT[R.deck[p]],rev:(r[i]&1)===1}));
  R.ai=null;R.step='result';render();if(R.mode==='ai')rAI();
}
function rAskAI(){
  if(!(S.pw||(S.acct&&S.acct.role==='user'))){R.ai={err:'login'};render();return;}
  if(!S.pw&&S.acct.tokens<1){R.ai={err:'Token ไม่พอ ซื้อ Token ได้ที่แท็บ 💳 ซื้อ/ต่ออายุ'};render();return;}
  if(!confirm(aiCfm('ทำนายไพ่ชุดนี้แบบละเอียด')))return;
  rAI();
}

/* 5) ปุ่ม MBTI + Birth Chart: คำอธิบาย + ยืนยัน + ล็อกหน้าจอ */
function bcAiBox(){
  return `<div class="sec-title">🤖 วิเคราะห์ด้วย AI</div>
  <div class="sm" style="line-height:1.7">ตำแหน่งดาวคำนวณด้วยสูตรในเว็บ AI ใช้เรียบเรียงคำทำนายเท่านั้น<br>🧠🌌 <b>บุคลิกภาพ MBTI + Birth Chart</b> วิเคราะห์นิสัย อารมณ์ การสื่อสาร ความรัก และการงาน โดยผสานผล MBTI ของคุณกับตำแหน่งดาว (ต้องทำ MBTI ก่อน)</div>
  <div class="row" style="margin-top:.4rem"><button class="btn" onclick="bcAI()">🧠🌌 บุคลิกภาพ MBTI + Birth Chart (ใช้ 1 Token)</button></div>
  <div class="err" id="baimsg"></div><div id="bai"></div>`;
}
async function bcAI(){
  const m=$('baimsg');m.textContent='';
  if(!B.res){m.textContent='กรุณาสร้างดวงกำเนิดก่อน';return;}
  if(!(S.pw||(S.acct&&S.acct.role==='user'))){m.textContent='🔒 ต้องเข้าสู่ระบบด้วยบัญชี User ก่อน';return;}
  if(!S.pw&&S.acct.tokens<1){m.textContent='🪙 Token ไม่พอ ซื้อได้ที่แท็บ 💳 ซื้อ/ต่ออายุ';return;}
  if(!S.mbti){m.textContent='🧠 โปรดทำแบบทดสอบ MBTI ก่อน (ยังไม่ได้หัก Token)';return;}
  if(!confirm(aiCfm('วิเคราะห์บุคลิกภาพ MBTI + Birth Chart')))return;
  $('bai').innerHTML='';aiLock(true);
  try{
    const d=await api('apiPersonalityReading',cred(),{mbti:S.mbti.type,born:B.d+' '+MONTHS[B.m]+' '+B.y,chart:bcSummary()});
    if(d.tokens!=null&&S.acct)S.acct.tokens=d.tokens;
    const pre='style="white-space:pre-line"';
    $('bai').innerHTML=`<div class="sumbox" ${pre}>${esc(d.intro)}</div>`
      +(d.sections||[]).map(s=>`<div class="sumbox"><b>▸ ${esc(s.title)}</b><br><span ${pre}>${esc(s.reading)}</span></div>`).join('')
      +`<div class="sumbox"><b>💪 จุดแข็ง</b><br><span ${pre}>${esc(d.strengths)}</span></div>`
      +`<div class="sumbox"><b>⚠️ จุดที่ควรระวัง</b><br><span ${pre}>${esc(d.cautions)}</span></div>`
      +`<div class="sumbox"><b>💡 คำแนะนำ</b><br><span ${pre}>${esc(d.advice)}</span></div>`
      +(d.tokens!=null?`<div class="sm">🪙 Token คงเหลือ ${d.tokens}</div>`:'');
  }catch(e){
    m.textContent=e.message==='MBTI_REQUIRED'?'🧠 ยังไม่มีผล MBTI ที่บันทึกไว้ กรุณาทำแบบทดสอบก่อน':'⚠ '+e.message;
  }finally{aiLock(false);}
}
</script>
<script>

function t2Num(v,blur){T2.numEl.style.opacity=String(v);T2.numEl.style.filter='blur('+blur+'px)';T2.numEl.style.transform='scale('+(0.84+0.16*v)+')';}

  T2.bar.style.width='0';T2.res.innerHTML='<span class="sm">ตั้งจิตแล้วเริ่มได้เลย</span>';T2.autoBtn.disabled=false;T2.autoBtn.textContent='ทำอัตโนมัติ';

function t2Line(x0,y0,x1,y1){
  const g=T2.g,d=T2.dpr,dx=x1-x0,dy=y1-y0,len=Math.hypot(dx,dy)||1,n=Math.max(1,Math.floor(len/(3*d)));
  g.globalCompositeOperation='destination-out';g.fillStyle='#000';
  for(let i=0;i<=n;i++){

function t2Flake(px,py){
  const c=document.createElement('span');c.className=Math.random()<.3?'t2dust':'t2chip';
  c.style.left=px+'px';c.style.top=py+'px';

function t2Check(){

  const d=T2.g.getImageData(x0,y0,w,h).data;let c=0,n=0;
  for(let i=3;i<d.length;i+=16){n++;if(d[i]<40)c++;}
  const r=c/Math.max(1,n);T2.bar.style.width=Math.round(Math.min(1,r)*100)+'%';

function t2Light(i){
  if(T2.lit[i])return;
  T2.lit[i]=0.08;T2.hint.textContent='ไฟกำลังติด...';T2.res.innerHTML='<span class="sm">รอให้เปลวติดก่อน</span>';
  const t0=performance.now();

function t2Loop(){
  if(T2.mode!=='incense')return;

    [132,154,176].forEach(function(x,i){
      if(T2.lit[i]&&Math.random()<thick)T2.smoke.push({x:x-6+(Math.random()*8-4),y:286,r:2+Math.random()*3,a:T2.forming?0.22:0.16,vx:(Math.random()-.5)*.35});
    });
    T2.smoke.forEach(function(p){p.y-=T2.forming?0.55:0.85;p.x+=p.vx+Math.sin(p.y/18)*.15;p.r+=.035;p.a*=.992;});

function t2Form(){
  if(T2.forming||T2.done)return;

  T2.hint.textContent=T2.mode==='bark'?'รอยขูดกำลังรวมเป็นเลข...':'ควันกำลังรวมตัว อย่าเพิ่งปิดหน้า';
  T2.res.innerHTML='<span class="sm">กำลังก่อตัว</span>';

function t2Auto(){

  if(T2.mode==='incense'){
    let i=0;(function step(){if(T2.done)return;t2Light(i);i++;if(i<3)T2.timers.push(setTimeout(step,1700));})();
    return;
  }
  const d=T2.dpr,strokes=[[134,208,186,214],[142,230,198,224],[128,250,184,258],[138,272,202,266],[130,294,192,300],[144,316,196,310],[132,336,184,342]];
  let si=0;
  function stroke(){
    if(T2.done||T2.forming)return;
    if(si>=strokes.length){t2Check();t2Form();return;}
    const s=strokes[si],t0=performance.now(),dur=680;
    (function f(now){
      if(T2.done||T2.forming)return;
      const p=Math.min(1,(now-t0)/dur),e=p*p*(3-2*p);
      const x=(s[0]+(s[2]-s[0])*e)*d,y=(s[1]+(s[3]-s[1])*e+Math.sin(p*8)*1.4)*d;
      if(!T2.last)T2.last=[x,y];
      t2Line(T2.last[0],T2.last[1],x,y);T2.last=[x,y];
      T2.tool.style.display='block';T2.tool.style.left=(x/d)+'px';T2.tool.style.top=(y/d)+'px';
      if(Math.random()<.55)t2Flake(x/d,y/d);
      T2.bar.style.width=Math.round(((si+p)/strokes.length)*78)+'%';
      t2Num(Math.min(.55,(si+p)/strokes.length*.7),8-(si/strokes.length)*4);
      if(p<1)requestAnimationFrame(f);
      else{T2.last=null;si++;T2.timers.push(setTimeout(stroke,160));}
    })(t0);
  }

function t2Reveal(){

<script>

const imgKey=c=>c.t==='major'?'m'+String(c.no).padStart(2,'0'):c.t+String(c.no).padStart(2,'0');
function dimg(key,cls,alt,style){
  const s=IMGC[key]||'';

/* เติมรูปให้ <img data-k> ที่มองเห็นอยู่ (กล่องที่ยังไม่กางจะรอจนกางก่อน) */
function hydrate(){
  document.querySelectorAll('img[data-k]:not([data-l])').forEach(im=>{
    if(!im.getClientRects().length)return;

  adminManual = async function() {
    const res = await _adminManual.apply(this, arguments);
    if (res && confirm('บันทึกสำเร็จ ต้องการดูตัวอย่างที่ User จะเห็นหรือไม่?')) {
      alert('ตัวอย่างที่ User เห็น:\nชุด 1-4: ' + [1,2,3,4].map(i => (typeof MAN !== 'undefined' && MAN['s'+i+'n']) || '').join(' / ') + '\n6 หลัก: ' + ((typeof MAN !== 'undefined' && MAN.sixn) || ''));
    }
    return res;
  };
}

/* ฟอร์มขอรีเซ็ตรหัสผ่าน */
function showResetForm() {
  const html = `<div class="card"><b>ลืมรหัสผ่าน</b>
    <input class="inp" id="ru" placeholder="Username">
    <input class="inp" id="rc" placeholder="เบอร์/อีเมลติดต่อ (เพื่อยืนยัน)">
    <div class="err" id="rmsg"></div>
    <button class="btn" onclick="doReset()">ส่งคำขอรีเซ็ต</button>
    <button class="btn o" onclick="render()">กลับ</button></div>`;
  document.getElementById('app').innerHTML = html;
}
async function doReset() {
  const u = document.getElementById('ru').value, c = document.getElementById('rc').value, m = document.getElementById('rmsg');
  m.textContent = '';
  try {
    await api('apiRequestPasswordReset', u, c);
    m.className = 'err ok';
    m.textContent = 'ส่งคำขอแล้ว Admin จะติดต่อกลับเพื่อตั้งรหัสใหม่';
  } catch(e) { m.textContent = e.message; }
}

/* เพิ่มลิงก์ลืมรหัสในหน้า Login */
const _loginView = typeof loginView === 'function' ? loginView : null;
if (_loginView) {
  loginView = function() {
    const html = _loginView();
    return html.replace(/<\/div>\s*$/, '<div style="margin-top:8px;text-align:center"><a href="#" onclick="showResetForm();return false;" style="color:var(--a);font-size:13px">ลืมรหัสผ่าน?</a></div></div>');
  };
}
</script>
</body></html>
<script>
/* ===== Admin: กรอกเลขเอง (manual) ===== */
const MAN={};
const mv=k=>esc(MAN[k]||'');
function mset(k,el,digits){if(digits)el.value=el.value.replace(/\D/g,'');MAN[k]=el.value;}
function mmsg(m,ok){const e=$('mmsg');if(e){e.textContent=m;e.className='err'+(ok?' ok':'');}}

function manualForm(){
  const blk=(i,title)=>`<div class="h" style="margin-bottom:.6rem"><b>${title}</b>
    <input class="inp" inputmode="numeric" maxlength="3" placeholder="เลข 3 หลัก" value="${mv('s'+i+'n')}" oninput="mset('s${i}n',this,1)" style="margin-top:.4rem;font:600 20px var(--mono);letter-spacing:.14em">
    <input class="inp" placeholder="ที่มา (ชื่อสำนัก/สูตร)" value="${mv('s'+i+'s')}" oninput="mset('s${i}s',this)">
    <textarea class="inp" placeholder="รายละเอียด / เหตุผล" oninput="mset('s${i}r',this)">${mv('s'+i+'r')}</textarea></div>`;
  return `<div class="card"><b>✍️ กรอกเลขเอง (Manual)</b>
    <div class="sm" style="margin:.3rem 0 .5rem">พิมพ์เลขและรายละเอียดเองได้เลย ไม่ต้องใช้ AI · บันทึกแล้ว User จะเห็นเป็นงวดล่าสุดเหมือนเดิม</div>
    ${dsel('mn',16)}
    ${[1,2,3,4].map(i=>blk(i,'ชุดที่ '+i)).join('')}
    <div class="h" style="margin-bottom:.6rem"><b>ชุด 6 หลัก</b>
      <input class="inp" inputmode="numeric" maxlength="6" placeholder="เลข 6 หลัก" value="${mv('sixn')}" oninput="mset('sixn',this,1)" style="margin-top:.4rem;font:600 20px var(--mono);letter-spacing:.14em">
      <textarea class="inp" placeholder="รายละเอียด / เหตุผล" oninput="mset('sixr',this)">${mv('sixr')}</textarea></div>
    <textarea class="inp" placeholder="สรุปงวด" oninput="mset('sum',this)">${mv('sum')}</textarea>
    <div class="err" id="mmsg"></div>
    <div class="row"><button class="btn g" id="msave" onclick="adminManual()">💾 บันทึกเลขที่กรอก</button>
    <button class="btn o" onclick="if(confirm('ล้างฟอร์มทั้งหมด?')){for(const k in MAN)delete MAN[k];render();}">ล้างฟอร์ม</button></div></div>`;
}

async function adminManual(){
  const r={};
  for(let i=1;i<=4;i++){
    const n=MAN['s'+i+'n']||'';
    if(n.length!==3)return mmsg('ชุดที่ '+i+' ต้องเป็นเลข 3 หลัก');
    r['set'+i]={num:n,source:MAN['s'+i+'s']||'',reason:MAN['s'+i+'r']||''};
  }
  if((MAN.sixn||'').length!==6)return mmsg('ชุด 6 หลักต้องเป็นเลข 6 หลัก');
  r.sixDigit={num:MAN.sixn,reason:MAN.sixr||''};
  r.summary=MAN.sum||'';
  const label=dlabel('mn');
  if(!confirm('บันทึกเลขงวด '+label+' ?\n\nชุด 1-4: '+[1,2,3,4].map(i=>r['set'+i].num).join(' / ')+'\nชุด 6 หลัก: '+r.sixDigit.num))return;
  const b=$('msave');b.disabled=true;mmsg('กำลังบันทึก…',1);
  try{
    const rec=await api('adminSaveManual',S.pw,label,r);
    S.hist.unshift(rec);
    for(const k in MAN)delete MAN[k];
    render();mmsg('✅ บันทึกงวด '+label+' แล้ว User จะเห็นเป็นงวดล่าสุด',1);
  }catch(e){b.disabled=false;mmsg(e.message);}
}
</script>
